name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  donnees:
    name: Contrôle des données
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests de la chaîne d'import
        run: python3 tools/tests_import.py

      - name: Cohérence des sources et des fichiers livrés
        run: python3 tools/generer_donnees.py --verifier

  build:
    name: Tests + APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provisionnement de la chaîne Gradle
        timeout-minutes: 10
        run: ./gradlew --version

      - name: Tests unitaires
        timeout-minutes: 10
        run: ./gradlew testDebugUnitTest --stacktrace

      # Sans secret de signature (pull request venant d'un fork, dépôt fraîchement cloné), le
      # keystore n'est pas écrit : la construction se poursuit et produit un binaire non signé.
      - name: Préparation du keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "::notice::Keystore de signature en place."
          else
            echo "::warning::Aucun secret ANDROID_KEYSTORE_BASE64 : les binaires de release ne seront pas signés."
          fi

      - name: Construction des binaires
        timeout-minutes: 20
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Effacement du keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Le nom du fichier de release dépend de la présence de la signature
      # (`app-release.apk` une fois signé, `app-release-unsigned.apk` sinon).
      - name: Renommage des binaires
        run: |
          set -euo pipefail
          court="${GITHUB_SHA::7}"
          mkdir -p binaires

          cp app/build/outputs/apk/debug/app-debug.apk \
             "binaires/aire-autoroute-debug-${court}.apk"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "binaires/aire-autoroute-release-${court}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               "binaires/aire-autoroute-release-non-signe-${court}.apk"
          fi

          cp app/build/outputs/bundle/release/app-release.aab \
             "binaires/aire-autoroute-${court}.aab"

          ( cd binaires && sha256sum ./* > SHA256SUMS.txt )

      - name: Publication de l'APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: binaires/aire-autoroute-debug-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publication de l'APK de release
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: binaires/aire-autoroute-release-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publication du bundle pour le Play Store
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: binaires/aire-autoroute-*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publication des empreintes
        uses: actions/upload-artifact@v4
        with:
          name: empreintes
          path: binaires/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publication des rapports de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          retention-days: 7

      - name: Résumé
        run: |
          {
            echo "### Binaires construits"
            echo ""
            for fichier in binaires/*.apk binaires/*.aab; do
              echo "- \`$(basename "$fichier")\` ($(du -h "$fichier" | cut -f1))"
            done
            echo ""
            if [ -f app/build/outputs/apk/release/app-release.apk ]; then
              echo "Release **signée** avec la clé d'upload."
            else
              echo "Release **non signée** : secret \`ANDROID_KEYSTORE_BASE64\` absent."
            fi
            echo ""
            echo "Le \`.aab\` est le fichier à téléverser dans la Play Console ;"
            echo "l'\`.apk\` sert à l'installation directe."
          } >> "$GITHUB_STEP_SUMMARY"

  publication:
    name: Release sur tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Seuls les APK sont attachés à la release GitHub : le bundle ne s'installe pas
      # directement, il reste un artefact de CI destiné à la Play Console.
      - name: Récupération de l'APK de release
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: binaires

      - name: Création de la release
        uses: softprops/action-gh-release@v2
        with:
          files: binaires/aire-autoroute-release-*.apk
